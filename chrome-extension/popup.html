<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>나중이</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f172a;
      color: #f8fafc;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 18px 12px;
      border-bottom: 1px solid #1e293b;
    }

    .logo { font-size: 18px; font-weight: 700; }
    .logo span { color: #38bdf8; }

    .status-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #ef4444;
    }
    .status-dot.logged-in { background: #22c55e; }

    .content { padding: 16px 18px; }

    .url-preview {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 14px;
    }

    .url-preview .page-title {
      font-size: 13px;
      font-weight: 600;
      color: #f1f5f9;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 3px;
    }

    .url-preview .page-url {
      font-size: 11px;
      color: #64748b;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .btn-save {
      width: 100%;
      background: #0ea5e9;
      color: white;
      border: none;
      border-radius: 10px;
      padding: 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.15s;
    }

    .btn-save:hover:not(:disabled) { background: #38bdf8; }
    .btn-save:disabled { opacity: 0.5; cursor: not-allowed; }

    .btn-save .spinner {
      width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .result {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 0 8px;
      gap: 8px;
    }

    .result-icon {
      width: 48px; height: 48px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
    }

    .result-icon.success { background: rgba(14, 165, 233, 0.15); }
    .result-icon.error { background: rgba(239, 68, 68, 0.15); }
    .result-icon.duplicate { background: rgba(234, 179, 8, 0.15); }

    .result-msg {
      font-size: 14px;
      font-weight: 600;
      color: #f1f5f9;
    }

    .result-sub {
      font-size: 12px;
      color: #64748b;
      text-align: center;
    }

    .login-section {
      padding: 20px 18px;
      text-align: center;
      space-y: 12px;
    }

    .login-hint {
      font-size: 13px;
      color: #64748b;
      margin-bottom: 12px;
    }

    .btn-login {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: white;
      color: #1e293b;
      border: none;
      border-radius: 10px;
      padding: 10px 18px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }

    .btn-login:hover { background: #f1f5f9; }

    .footer {
      padding: 10px 18px 14px;
      border-top: 1px solid #1e293b;
      display: flex;
      justify-content: center;
    }

    .open-app {
      font-size: 11px;
      color: #475569;
      text-decoration: none;
      cursor: pointer;
      background: none;
      border: none;
    }

    .open-app:hover { color: #94a3b8; }

    #state-save { display: block; }
    #state-result { display: none; }
    #state-login { display: none; }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">나<span>중</span>이</div>
    <div class="status-dot" id="status-dot"></div>
  </div>

  <!-- 저장 상태 -->
  <div id="state-save">
    <div class="content">
      <div class="url-preview">
        <div class="page-title" id="page-title">페이지 정보 로딩 중...</div>
        <div class="page-url" id="page-url"></div>
      </div>
      <button class="btn-save" id="btn-save" onclick="handleSave()">
        <svg width="16" height="16" fill="none" stroke="white" stroke-width="2.5" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z"/>
        </svg>
        나중이에 저장
      </button>
    </div>
  </div>

  <!-- 결과 상태 -->
  <div id="state-result">
    <div class="content">
      <div class="result">
        <div class="result-icon" id="result-icon">✓</div>
        <div class="result-msg" id="result-msg"></div>
        <div class="result-sub" id="result-sub"></div>
      </div>
    </div>
  </div>

  <!-- 로그인 필요 -->
  <div id="state-login">
    <div class="login-section">
      <p class="login-hint">로그인이 필요해요</p>
      <button class="btn-login" onclick="openApp('/login')">
        <svg width="16" height="16" viewBox="0 0 24 24">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
        </svg>
        Google로 로그인
      </button>
    </div>
  </div>

  <div class="footer">
    <button class="open-app" onclick="openApp('/home')">앱에서 보기 →</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
